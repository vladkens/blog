    .link { fill: none; stroke: #5e5950; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .tint { fill: #100e0b; fill-opacity: 0.16; }
    .vec { fill: #100e0b; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .start { text-anchor: start; }
    .main { font-size: 20px; fill: #100e0b; }

    @media (prefers-color-scheme: dark) {
      .line { stroke: #f3eee3; }
      .faint, .link { stroke: #8f897d; }
      .tint, .vec, .main { fill: #f3eee3; }
    }
  </style>

