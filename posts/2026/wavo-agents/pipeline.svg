<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256">
  <style>
    .line { fill: none; stroke: #100e0b; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .group { fill: none; stroke: #5e5950; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .main { font-size: 20px; fill: #100e0b; }
    .note { font-size: 16px; fill: #5e5950; }

    @media (prefers-color-scheme: dark) {
      .line { stroke: #f3eee3; }
      .group { stroke: #8f897d; }
      .main { fill: #f3eee3; }
      .note { fill: #8f897d; }
    }
  </style>

  <defs>
